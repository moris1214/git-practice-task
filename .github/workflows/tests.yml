name: Unit tests

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'README*'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run C unit tests
        run: |
          gcc test_array_utils.c array_utils.c -o test_runner
          ./test_runner
